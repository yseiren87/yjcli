# Generated Python library of the shared proto contract (seeded by yjcli; yours to edit).
# Generated code goes to {{proto_python_package}}/. Services consume it as a path dependency, e.g.
#   uv add --editable <relative path to proto/dist/python>
[project]
name = "{{proto_python_dist}}"
version = "0.1.0"
description = "Generated gRPC/protobuf client and message code."
requires-python = ">=3.10"
dependencies = ["grpcio>=1.60", "protobuf>=4.25"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["{{proto_python_package}}"]
