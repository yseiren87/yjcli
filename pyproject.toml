[project]
name = "yjcli"
version = "0.3.1"
description = "Wizard that scaffolds YJ architecture repos: platforms, services, tooling plugins, and AI agent wiring (Cursor/Claude/Codex)."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
  { name = "yseiren87" },
]
keywords = ["cli", "scaffold", "cursor", "claude", "codex", "agent"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Code Generators",
  "Topic :: Utilities",
]
dependencies = [
  "questionary>=2.1.1",
  "rich>=15.0.0",
  "typer>=0.12",
]

[project.urls]
Homepage = "https://github.com/yseiren87/yjcli"
Repository = "https://github.com/yseiren87/yjcli"
Issues = "https://github.com/yseiren87/yjcli/issues"

[project.scripts]
yjcli = "yjcli.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yjcli"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/README.md",
  "/LICENSE",
  "/pyproject.toml",
]

[tool.uv]
package = true
