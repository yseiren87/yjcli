[project]
name = "djcli"
version = "0.1.0"
description = "Scaffold platforms, services, and AI agent wiring (Cursor/Claude) for DJ architecture repos."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "typer>=0.12",
]

[project.scripts]
djcli = "djcli.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/djcli"]

# Include non-Python scaffold assets in the wheel.
[tool.hatch.build.targets.wheel.force-include]
"src/djcli/data" = "djcli/data"

[tool.uv]
package = true
