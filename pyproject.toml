[project]
name = "djcli"
version = "0.0.1"
description = "Scaffold platforms, services, and AI agent wiring (Cursor/Claude) for DJ architecture repos."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
  { name = "yseiren87" },
]
keywords = ["cli", "scaffold", "cursor", "claude", "agent"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Code Generators",
  "Topic :: Utilities",
]
dependencies = [
  "typer>=0.12",
]

[project.urls]
Homepage = "https://github.com/yseiren87/djcli"
Repository = "https://github.com/yseiren87/djcli"
Issues = "https://github.com/yseiren87/djcli/issues"

[project.scripts]
djcli = "djcli.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/djcli"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/README.md",
  "/LICENSE",
  "/pyproject.toml",
]

[tool.uv]
package = true
